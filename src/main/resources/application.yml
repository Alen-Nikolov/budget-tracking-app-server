spring:
  application:
    name: budget-tracker-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budget-tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (src/main/resources/db/migration)

app:
  jwt:
    # DEV ONLY default. Override with JWT_SECRET (>= 32 chars) in any real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration: 1h            # access token (JWT) lifetime
  cors:
    # Origins allowed to call the API from a browser (the admin panel). Comma-separated.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  refresh-token:
    expiration: 90d           # sliding: every refresh issues a new token with a fresh 90 days
  login-rate-limit:
    max-failures-per-email: 5
    max-failures-per-ip: 20
    window: 1h
