spring:
  application:
    name: budget-tracker-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budget-tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (src/main/resources/db/migration)

app:
  jwt:
    # DEV ONLY default. Override with JWT_SECRET (>= 32 chars) in any real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration: 1h            # access token (JWT) lifetime
  cors:
    # Origins allowed to call the API from a browser (the admin panel). Comma-separated.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  refresh-token:
    expiration: 90d           # sliding: every refresh issues a new token with a fresh 90 days
  login-rate-limit:
    max-failures-per-email: 5
    max-failures-per-ip: 20
    window: 1h
  mail:
    from: ${MAIL_FROM:noreply@budgettracker.local}
  verification:
    expiration: 24h
    resend-cooldown: 60s
    # Public address of THIS server, as reachable by the person clicking the link in their email.
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    web-redirect-url: ${VERIFY_WEB_REDIRECT_URL:http://localhost:3000/email-verified}
    android-redirect-url: ${VERIFY_ANDROID_REDIRECT_URL:budgettracker://email-verified}

server:
  port: ${PORT:8080}                                  # hosts usually provide PORT
  # Set FORWARD_HEADERS_STRATEGY=framework ONLY when running behind the host's trusted proxy/load balancer,
  # so the real client IP (for the login rate limit) is read from X-Forwarded-For.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health                               # nothing else is exposed
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false                                  # an SMTP hiccup should not mark the server as down
